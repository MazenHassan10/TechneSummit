# Checks the official Techne Summit agenda every 30 minutes.
# The app reads the official calendar feed (times, new and cancelled sessions – the site blocks cloud
# servers from the full pages). Speaker changes are checked from the Team Leader's Mac (src/watch-local.ts).
# Differences become "pending changes" in the app: everyone is alerted, only the Team Leader approves.
name: Agenda watch

on:
  schedule:
    - cron: "*/30 * * * *" # UTC; GitHub may start runs a few minutes late
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/agenda-watch.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check official agenda
        env:
          APP_URL: ${{ vars.APP_URL || 'https://techne-summit-xi.vercel.app' }}
        run: |
          code=$(curl -sS -o result.json -w "%{http_code}" "$APP_URL/api/cron/agenda")
          cat result.json; echo
          test "$code" = "200"

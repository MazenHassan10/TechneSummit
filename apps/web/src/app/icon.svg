<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Great Hall PR · Techne Summit Alexandria
       The Bibliotheca Alexandrina's tilted sun-disc roof on Techne blue, with the orange ALEXANDRIA bar. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a6fc4"/>
      <stop offset="1" stop-color="#0b4683"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="226" r="168"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g clip-path="url(#disc)">
    <rect width="512" height="512" fill="#ffffff"/>
    <!-- glazed roof lines -->
    <g fill="#105ca8" opacity="0.16">
      <rect x="0" y="134" width="512" height="18" transform="rotate(-12 256 226)"/>
      <rect x="0" y="190" width="512" height="18" transform="rotate(-12 256 226)"/>
    </g>
    <!-- the disc sinks below the slanted roof line -->
    <polygon points="0,302 512,194 512,512 0,512" fill="#8cbcf0"/>
    <polygon points="0,302 512,194 512,214 0,322" fill="#0b4683" opacity="0.35"/>
  </g>
  <!-- ALEXANDRIA bar -->
  <rect x="96" y="418" width="320" height="44" rx="12" fill="#f15a22"/>
</svg>
